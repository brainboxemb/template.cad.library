{{ define "main" }}
<main class="cad-page-shell cad-catalog-page">
  <section class="cad-model-hero cad-model-hero-small">
    <p class="cad-model-kicker">CAD library</p>
    <h1>{{ .Title }}</h1>
    <p>Explore the library examples and their build and verification evidence.</p>
  </section>
  <section class="cad-section cad-catalog-section">
    <div class="cad-model-grid">
      {{ range .RegularPages.ByWeight }}{{ partial "cad/example-card.html" . }}{{ end }}
    </div>
  </section>
</main>
{{ end }}
