[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-library-verification"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["brainboxemb-cad-verification-lib @ git+https://github.com/brainboxemb/lib.py.cad.verification.git@c7c145b7be0c602724e8cca874ef29990baaad1e"]

[tool.setuptools.packages.find]
where = ["src"]
